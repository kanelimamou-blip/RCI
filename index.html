<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RCI · téléphone</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c2410c">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RCI">
<style>
  :root{--bg:#f6f5f3;--card:#fff;--ink:#1c1917;--muted:#57534e;--line:#e7e5e4;--accent:#c2410c;--ok:#15803d;--bad:#b91c1c}
  @media (prefers-color-scheme:dark){:root{--bg:#1c1917;--card:#292524;--ink:#f5f5f4;--muted:#a8a29e;--line:#44403c;--accent:#ff8a3d;--ok:#4ade80;--bad:#f87171}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
  .c{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:460px;width:100%}
  h1{font-size:20px;margin:10px 0 6px}
  p,li{color:var(--muted);font-size:14.5px}
  ol{padding-left:20px;margin:6px 0 14px}
  label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 4px}
  input{display:block;width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
  button{width:100%;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px;font:inherit;font-weight:600;margin-top:16px;cursor:pointer}
  button:disabled{opacity:.6}
  .msg{min-height:22px;margin:10px 0 0;font-size:14px}
  .ko{color:var(--bad)} .ok{color:var(--ok)}
  img{width:48px;height:48px;border-radius:12px}
</style>
</head>
<body>
<div class="c" id="c">
  <img src="icons/rci-192.png" alt="">
  <h1>RCI · appli téléphone</h1>
  <p id="chg">Chargement…</p>
</div>
<script>
/* Appli téléphone RCI pour un collègue qui ne peut pas joindre le PC serveur :
   1. sur son ordinateur (application RCI) : Mon compte › « Préparer mon téléphone » -> fichier chiffré + code ;
   2. ici : « Importer mon dossier » avec ce fichier et ce code, puis choix du code d'accès du téléphone ;
   3. il travaille hors ligne ; « Ma réserve » › « Exporter » -> fichier à importer sur son ordinateur.
   Aucune donnée n'est sur ce site : elles sont uniquement sur le téléphone, effacées par « Effacer ce téléphone ». */
(function () {
  'use strict';
  var BASE = location.pathname.replace(/[^/]*$/, '');
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', { scope: BASE }).catch(function () {});
  var $ = function (i) { return document.getElementById(i); };
  function idb() { return new Promise(function (ok, ko) { var r = indexedDB.open('rci-hors-ligne', 1); r.onupgradeneeded = function () { r.result.createObjectStore('kv'); }; r.onsuccess = function () { ok(r.result); }; r.onerror = function () { ko(r.error); }; }); }
  function lire(k) { return idb().then(function (d) { return new Promise(function (ok) { var q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = function () { ok(q.result); }; q.onerror = function () { ok(undefined); }; }); }); }
  function ecrire(L) { return idb().then(function (d) { return new Promise(function (ok, ko) { var t = d.transaction('kv', 'readwrite'), s = t.objectStore('kv'); L.forEach(function (x) { s.put(x[1], x[0]); }); t.oncomplete = function () { ok(); }; t.onerror = function () { ko(t.error); }; }); }); }
  function norm(c) { return String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
  function cle(code, sel) { var te = new TextEncoder(); return crypto.subtle.importKey('raw', te.encode(norm(code)), 'PBKDF2', false, ['deriveKey']).then(function (k) { return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: sel, iterations: 250000, hash: 'SHA-256' }, k, { name: 'AES-GCM', length: 256 }, false, ['decrypt']); }); }
  function ouvrirFichier(f, code) {
    return f.arrayBuffer().then(function (ab) {
      var u = new Uint8Array(ab), p = new TextDecoder().decode(u.slice(0, 40)).split('\n');
      if (p[0] !== 'RCI-CHIFFRE-1') throw new Error('Ce fichier n\'est pas un dossier RCI.');
      var d = (p[0] + '\n' + p[1] + '\n').length;
      return cle(code, u.slice(d, d + 16)).then(function (k) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.slice(d + 16, d + 28) }, k, u.slice(d + 28)); })
        .catch(function () { throw new Error('Code incorrect (ou fichier abîmé).'); })
        .then(function (pt) { if (p[1] !== '1') return new Uint8Array(pt); return new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer(); })
        .then(function (b) { return JSON.parse(new TextDecoder().decode(b)); });
    });
  }
  function empreinte(code, sel) { var te = new TextEncoder(); return crypto.subtle.importKey('raw', te.encode(String(code)), 'PBKDF2', false, ['deriveBits']).then(function (k) { return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: sel, iterations: 250000, hash: 'SHA-256' }, k, 256); }).then(function (b) { return Array.from(new Uint8Array(b)); }); }

  function ecranImport(msg) {
    $('c').innerHTML = '<img src="icons/rci-192.png" alt=""><h1>RCI · appli téléphone</h1>' +
      '<p>Importez le <b>dossier</b> préparé sur votre ordinateur (application RCI › Mon compte › « Préparer mon téléphone »).</p>' +
      '<label>Fichier du dossier (.rci)<input type="file" id="f" accept=".rci,application/octet-stream"></label>' +
      '<label>Code du dossier<input id="code" placeholder="XXXX-XXXX" autocomplete="off" style="text-transform:uppercase"></label>' +
      '<label>Votre code d’accès pour ce téléphone (6 à 12 chiffres)<input id="c1" type="password" inputmode="numeric" autocomplete="new-password"></label>' +
      '<label>Confirmer le code d’accès<input id="c2" type="password" inputmode="numeric" autocomplete="new-password"></label>' +
      '<button id="go">Importer mon dossier</button><p class="msg" id="msg">' + (msg || '') + '</p>' +
      '<p style="font-size:13px;margin-top:14px">Les données restent uniquement sur ce téléphone. Elles sont valables 30 jours ; ensuite, importez un nouveau dossier.</p>';
    $('go').onclick = function () {
      var f = $('f').files && $('f').files[0], c1 = $('c1').value, c2 = $('c2').value;
      if (!f) return dire('Choisissez le fichier du dossier.');
      if (!/^\d{6,12}$/.test(c1)) return dire('Le code d’accès doit faire 6 à 12 chiffres.');
      if (c1 !== c2) return dire('Les deux codes d’accès ne sont pas identiques.');
      $('go').disabled = true; dire('Ouverture du dossier…', 'ok');
      ouvrirFichier(f, $('code').value).then(function (o) {
        if (!o || o.format !== 'rci-telephone' || !o.compte || !o.compte.id) throw new Error('Ce fichier n’est pas un dossier téléphone RCI.');
        var C = 'u:' + o.compte.id + ':', D = {};
        (o.docs || []).forEach(function (x) { (D[x.c] || (D[x.c] = {}))[x.id] = x.d; });
        var sel = Array.from(crypto.getRandomValues(new Uint8Array(16)));
        return empreinte(c1, new Uint8Array(sel)).then(function (h) {
          return lire(C + 'file').then(function (fileExistante) {
            return ecrire([[C + 'snap', { seq: o.seq || 0, data: D, serv: o.serv || {}, servdoc: {}, t: Date.now() }], [C + 'vu', Date.parse(o.cree) || Date.now()],
              [C + 'verrou', { sel: sel, h: h, essais: 0, le: Date.now() }], [C + 'file', fileExistante || []], ['kit:compte', o.compte], ['kit:cree', o.cree]]);
          });
        }).then(function () { location.reload(); });
      }).catch(function (e) { $('go').disabled = false; dire(e.message); });
    };
  }
  function dire(t, cls) { $('msg').textContent = t; $('msg').className = 'msg ' + (cls || 'ko'); }

  function lancer(compte) {
    return fetch('app.html', { cache: 'no-cache' }).catch(function () { return caches.match(BASE + 'app.html'); }).then(function (r) { if (!r || !r.ok) throw new Error('Application indisponible sans réseau : ouvrez-la une première fois avec Internet.'); return r.text(); }).then(function (html) {
      var inj = '<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#c2410c"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">' +
        '<script>window.RCI_KIT={base:' + JSON.stringify(BASE) + '};window.RCI_SERVEUR=' + JSON.stringify(compte).replace(/</g, '\\u003c') + ';<\/script><script src="rci-serveur.js"><\/script>';
      html = html.replace(/<head>/i, '<head>' + inj);
      document.open(); document.write(html); document.close();
    });
  }
  lire('kit:compte').then(function (c) { return c ? lancer(c) : ecranImport(); }).catch(function (e) { $('c').innerHTML = '<h1>RCI</h1><p class="ko">' + e.message + '</p>'; });
  window.RCI_KIT_IMPORT = ecranImport;
})();
</script>
</body>
</html>
